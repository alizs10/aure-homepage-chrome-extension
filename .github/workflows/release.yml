
name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: aure-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $GITHUB_REF_NAME"
            exit 1
          fi

          if [[ ! -f RELEASE_NOTES.md ]]; then
            echo "Missing RELEASE_NOTES.md in the repository root."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const manifestPath = "manifest.base.json";
          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, "utf8")
          );

          manifest.version = process.env.VERSION;

          fs.writeFileSync(
            manifestPath,
            JSON.stringify(manifest, null, 4) + "\n"
          );
          NODE

      - name: Build extension
        run: bun run build

      - name: Verify build output
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f dist/chrome/manifest.json
          test -f dist/chrome/background.js
          test -f dist/chrome/index.html
          test -f dist/firefox/manifest.json
          test -f dist/firefox/background.js
          test -f dist/firefox/index.html

          CHROME_VERSION="$(node -p "require('./dist/chrome/manifest.json').version")"
          FIREFOX_VERSION="$(node -p "require('./dist/firefox/manifest.json').version")"

          if [[ "$CHROME_VERSION" != "$VERSION" ]]; then
            echo "Chrome manifest version mismatch: expected $VERSION, got $CHROME_VERSION"
            exit 1
          fi

          if [[ "$FIREFOX_VERSION" != "$VERSION" ]]; then
            echo "Firefox manifest version mismatch: expected $VERSION, got $FIREFOX_VERSION"
            exit 1
          fi

      - name: Package extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun run package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "aure-homepage-chrome-v${VERSION}.zip" \
            "aure-homepage-firefox-v${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aure Homepage v${VERSION}" \
            --notes-file RELEASE_NOTES.md
